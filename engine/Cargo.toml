[package]
name = "vcb"
version = "0.1.0"
edition = "2021"
description = "Tick-exact simulation engine for Virtual Circuit Board .vcb files"

[dependencies]
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
png = "0.18"
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
toml = "0.8"
zstd = "0.13"

# v2 attempt 15 (specs/vcb-engine-v2-log.md): whole-program optimisation. The native CPU is set in .cargo/config.toml.
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"

# `--cfg profiling` switches on v2's counters and keeps its main functions apart for a sampling profiler.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(profiling)', 'cfg(separate)'] }
